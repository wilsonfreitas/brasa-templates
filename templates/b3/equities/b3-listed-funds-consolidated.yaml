id: b3-listed-funds-consolidated
description: Fundos listados na B3, renda variável, renda fixa, imobiliários e criptomoedas
etl:
  pipeline:
    - step: load
      input: b3-listed-funds
      layer: input

    - step: to_dataframe

    - step: apply_lambda
      column: acronym
      expression: "x + '11'"
      output: symbol

    - step: rename_columns
      mapping:
        acronym: asset_name
        type: fund_type

    # B3 changed its fund types between 2025-06-08 and 2026-02-02: FIIs moved
    # from typeFund=ETF-FII to typeFund=FII, and ETF-FII now lists REIT index
    # ETFs (XFIX11, HERT11). Up to 2025-06-08 every ETF-FII row is an FII.
    - step: exec_code
      code: |
        old_fii = (data["fund_type"] == "ETF-FII") & (
            pd.to_datetime(data["refdate"]) <= "2025-06-08"
        )
        data.loc[old_fii, "fund_type"] = "FII"
        result = data

    - step: select_fields

    - step: apply_fields

writer:
  dataset: b3-listed-funds
  layer: staging

fields:
  - name: refdate
    description: Data de Referência
    type: date
  - name: asset_name
    description: Acrônimo - símbolo de negociação sem os números finais
    type: string
  - name: symbol
    description: Símbolo completo de negociação
    type: string
  - name: fund_name
    description: Nome do Fundo
    type: string
  - name: fund_type
    description: Tipo de Fundo (ETF, ETF-RF, ETF-FII, ETF-CRIPTO, FII, FIAGRO, FI-INFRA)
    type: string
  - name: fund_id
    description: ID do Fundo
    type: string
  - name: trading_name
    description: Nome de Negociação
    type: string
