[project]
name = "brasa-templates"
version = "0.0.0"
description = "Official templates, download plans and validation rules for brasa"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = [
    "brasa-marketdata",
    # shortcut: brasa calls DuckDB's .arrow(), removed in DuckDB 2.0 (sql_export
    # breaks on a fresh install); drop this cap once brasa uses .to_arrow_table().
    "duckdb<2",
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# The sibling brasa checkout: local main is ahead of PyPI until brasa-core 0.5.0.
brasa-marketdata = { path = "../brasa", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
timeout = 120
markers = [
    "integration: marks tests that require an internet connection (skip with --no-integration)",
]

# =============================================================================
# Ruff Configuration - Modern Python Linter & Formatter
# =============================================================================

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length (Black-compatible default)
line-length = 88

# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.lint]
# Enable recommended rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]

# Rules to ignore
ignore = [
    "E501",    # Line too long (handled by formatter)
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
    "PLC0415", # Import not at top-level (intentional lazy imports used throughout)
    "RUF059",  # Unpacked variable is never used (new rule in ruff >=0.9)
    "RUF043",  # Metacharacters in match= pattern (new rule in ruff >=0.9)
    "PLW0177", # Comparing against NaN (new rule in ruff >=0.9)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["brasa"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Use Unix-style line endings
line-ending = "auto"

# Format docstrings
docstring-code-format = true
